<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мисия: Правилни и неправилни дроби</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3ff;color:#1d2943;font-family:Arial,sans-serif}main{max-width:1040px;margin:20px auto;padding:24px;background:white;border-radius:22px;min-height:75vh;box-shadow:0 10px 28px #2234a014}h1{font-size:clamp(29px,4vw,44px)}h2{font-size:clamp(23px,3vw,32px)}p,li{font-size:21px;line-height:1.5}button,.button{background:#3455d8;border:0;border-radius:12px;color:white;padding:13px 19px;font-size:20px;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}button.secondary{background:#e3e9ff;color:#263d9d}button:disabled{opacity:.5;cursor:default}input{font-size:23px;padding:12px;border:2px solid #bbc6e5;border-radius:10px;max-width:100%}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;font-size:1.25em;font-weight:700;line-height:1.05;margin:0 .15em}.frac .num{border-bottom:2.5px solid currentColor;padding:0 .25em .12em}.frac .den{padding-top:.12em}.panel{background:#f1f5ff;padding:18px;border-radius:14px;margin:18px 0}.muted{color:#66718c}.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.options{display:grid;gap:12px}.options button{text-align:left}.feedback{background:#eaf8ec;border-left:5px solid #43a25e;padding:14px;margin:12px 0;border-radius:8px}.nav{display:flex;justify-content:space-between;max-width:1040px;margin:12px auto}.hidden{display:none}.math{font-size:28px}.badge{font-weight:bold;color:#324eb8}@media(max-width:700px){main{margin:8px;padding:16px}p{font-size:19px}}</style><main><div class="muted">Математика · 5. клас · Урок 24</div><h1>🚀 Мисия: Правилни, неправилни и реципрочни!</h1><div id="login"><p>Въведи кода от учителя и името си.</p><input id="code" placeholder="Код на стаята" inputmode="numeric" maxlength="6"><input id="name" placeholder="Име и фамилия"><p><button onclick="join()">Започни мисията</button></p><p><a href="/teacher.html">Вход за учителя →</a></p></div><div id="play" class="hidden"><p id="progress" class="badge"></p><h2 id="question"></h2><div id="options" class="options"></div><div id="feedback"></div><button id="next" class="hidden" onclick="advance()">Следваща задача →</button></div><div id="finish" class="hidden"><h2>🏁 Мисията приключи!</h2><p id="final"></p><p>Учителят вижда резултата ти в класацията.</p></div><p id="err" style="color:#b52b32"></p></main><script>function f(a,b){return `<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`}function mathify(s){return s.replace(/(\d+)\/(\d+)/g,(_,a,b)=>f(a,b))}let qs=[],index=0,id='',code='',score=0;async function api(path,body){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||'Грешка');return d}async function join(){try{code=document.getElementById('code').value.trim();let n=document.getElementById('name').value.trim();let d=await api('/api/join',{code,name:n});id=d.id;qs=await(await fetch('/api/questions')).json();document.getElementById('login').classList.add('hidden');document.getElementById('play').classList.remove('hidden');render()}catch(e){document.getElementById('err').textContent=e.message}}function render(){let q=qs[index];document.getElementById('progress').textContent=`Задача ${index+1} от ${qs.length} · ${score} точки`;document.getElementById('question').innerHTML=mathify(q.q);document.getElementById('options').innerHTML=q.options.map((o,i)=>`<button onclick="answer(${i})">${mathify(o)}</button>`).join('');document.getElementById('feedback').innerHTML='';document.getElementById('next').classList.add('hidden')}async function answer(a){try{let d=await api('/api/answer',{code,id,i:index,a});score=d.score;document.querySelectorAll('#options button').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=`<div class="feedback"><b>${d.correct?'✅ Вярно! +10 точки':'❌ Не е вярно.'}</b><p>${mathify(d.explain)}</p></div>`;document.getElementById('next').classList.remove('hidden');document.getElementById('next').textContent=index===qs.length-1?'Виж резултата':'Следваща задача →'}catch(e){document.getElementById('err').textContent=e.message}}function advance(){index++;if(index===qs.length){document.getElementById('play').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');document.getElementById('final').textContent=`Резултат: ${score} от ${qs.length*10} точки.`}else render()}</script></html>
