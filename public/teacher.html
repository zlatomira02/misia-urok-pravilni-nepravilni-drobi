<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учителски панел – Мисия 24</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3ff;color:#1d2943;font-family:Arial,sans-serif}main{max-width:1040px;margin:20px auto;padding:24px;background:white;border-radius:22px;min-height:75vh;box-shadow:0 10px 28px #2234a014}h1{font-size:clamp(29px,4vw,44px)}h2{font-size:clamp(23px,3vw,32px)}p,li{font-size:21px;line-height:1.5}button,.button{background:#3455d8;border:0;border-radius:12px;color:white;padding:13px 19px;font-size:20px;cursor:pointer;margin:5px;text-decoration:none;display:inline-block}button.secondary{background:#e3e9ff;color:#263d9d}button:disabled{opacity:.5;cursor:default}input{font-size:23px;padding:12px;border:2px solid #bbc6e5;border-radius:10px;max-width:100%}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;font-size:1.25em;font-weight:700;line-height:1.05;margin:0 .15em}.frac .num{border-bottom:2.5px solid currentColor;padding:0 .25em .12em}.frac .den{padding-top:.12em}.panel{background:#f1f5ff;padding:18px;border-radius:14px;margin:18px 0}.muted{color:#66718c}.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.options{display:grid;gap:12px}.options button{text-align:left}.feedback{background:#eaf8ec;border-left:5px solid #43a25e;padding:14px;margin:12px 0;border-radius:8px}.nav{display:flex;justify-content:space-between;max-width:1040px;margin:12px auto}.hidden{display:none}.math{font-size:28px}.badge{font-weight:bold;color:#324eb8}@media(max-width:700px){main{margin:8px;padding:16px}p{font-size:19px}}</style><main><div class="muted">Математика · 5. клас · Урок 24</div><h1>👩‍🏫 Учителски панел</h1><button onclick="create()">Създай нова стая</button><div id="room" class="hidden"><div class="panel"><p>Код за учениците:</p><h1 id="roomcode" style="font-size:64px;letter-spacing:7px"></h1><p>Учениците отварят: <a id="link" href="/" target="_blank"></a></p></div><h2>🏆 Класация на живо</h2><p class="muted">Обновява се автоматично на всеки 2 секунди.</p><div id="results"></div></div><p id="err" style="color:#b52b32"></p></main><script>let code='',token='',timer;async function create(){try{let r=await fetch('/api/create',{method:'POST'}),d=await r.json();code=d.code;token=d.token;document.getElementById('room').classList.remove('hidden');document.getElementById('roomcode').textContent=code;document.getElementById('link').textContent=location.origin;document.getElementById('link').href=location.origin;clearInterval(timer);await refresh();timer=setInterval(refresh,2000)}catch(e){document.getElementById('err').textContent=e.message}}async function refresh(){try{let r=await fetch(`/api/results?code=${code}&token=${token}`),d=await r.json();document.getElementById('results').innerHTML=d.students.length?`<div class="panel">${d.students.map((s,i)=>`<p>${i+1}. <b>${esc(s.name)}</b> — <b>${s.score} т.</b> · ${s.done}/${d.total} задачи</p>`).join('')}</div>`:'<p>Очакваме учениците да се включат…</p>'}catch(e){document.getElementById('err').textContent=e.message}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></html>
